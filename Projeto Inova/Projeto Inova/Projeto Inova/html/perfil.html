<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Literatura Além dos Astros</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastroeresenha.css">
    <link rel="icon" href="../assets/logo - Editado.png" type="image/x-icon">
</head>

<body>

    <header>
        <nav>
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="autores.html">Autores</a></li>
                <li><a href="livros.html">Livros</a></li>
                <li><a href="resenha.html">Resenhas</a></li>
                <li><a href="sobre.html">Sobre</a></li>

                <li class="dropdown-wrapper item-usuario-direita">
                    <a href="#" id="navTextoUsuario">
                        <img id="navAvatar" src="" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: none; vertical-align: middle; margin-right: 8px;">
                        <span>Usuário ▾</span>
                    </a>
                    <ul class="dropdown" id="listaDropdownUsuario">
                        <li><a href="login.html">Entrar</a></li>
                        <li><a href="cadastro.html">Cadastro</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="cadastro-container">
        <section class="cadastro-box" style="max-width: 700px; width: 100%; margin: 40px auto; padding: 30px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="fotoPerfil" src="../assets/logo - Editado.png" alt="Foto de Perfil" 
                     style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #fff;">
                
                <h1 id="perfilNome" style="margin-top: 15px;">Carregando...</h1>
                <p id="perfilUsuario" style="opacity: 0.8;"></p>

                <div style="margin-top: 15px;">
                    <label for="inputFoto" class="btn-cadastro" style="cursor: pointer; display: inline-block; padding: 10px 18px; font-family: sans-serif;">
                        Alterar Foto de Perfil
                    </label>
                    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                </div>
            </div>

            <hr style="margin: 25px 0; opacity: 0.2;">

            <h2>Minhas Resenhas Cadastradas</h2>
            <div id="minhasResenhasLista" style="margin-top: 15px;">
                <p>Carregando resenhas...</p>
            </div>

            <hr style="margin: 25px 0; opacity: 0.2;">

            <div style="text-align: center;">
                <p>Deseja encerrar sua conta permanentemente?</p>
                <button id="btnDeletarConta" style="background-color:#800000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 8px; font-family: sans-serif; font-weight: bolder;">
                    Deletar Minha Conta
                </button>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <p>© 2026 Literatura Além dos Astros — Leituras inesquecíveis.</p>
    </footer>

    <script src="../js/auth.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const usuarioSalvo = localStorage.getItem("usuarioLogado");

        if (!usuarioSalvo) {
            window.location.href = "login.html";
        } else {
            const user = JSON.parse(usuarioSalvo);

            document.getElementById("perfilNome").textContent = user.nome;
            document.getElementById("perfilUsuario").textContent = `@${user.usuario} • ${user.email}`;
            if (user.foto) {
                document.getElementById("fotoPerfil").src = user.foto;
            }

            // Alterar Foto de Perfil
            document.getElementById("inputFoto").addEventListener("change", function(e) {
                const arquivo = e.target.files[0];
                if (!arquivo) return;

                const leitor = new FileReader();
                leitor.onload = async function(evento) {
                    const base64Foto = evento.target.result;

                    const resposta = await fetch(`${API_URL}/usuarios/${user.id}/foto`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ foto: base64Foto })
                    });

                    if (resposta.ok) {
                        user.foto = base64Foto;
                        localStorage.setItem("usuarioLogado", JSON.stringify(user));
                        document.getElementById("fotoPerfil").src = base64Foto;
                        alert("Foto de perfil atualizada!");
                        location.reload();
                    }
                };
                leitor.readAsDataURL(arquivo);
            });

            // Deletar Conta
            document.getElementById("btnDeletarConta").addEventListener("click", async () => {
                if (!confirm("Tem certeza absoluta que deseja deletar sua conta?")) return;

                const resposta = await fetch(`${API_URL}/usuarios/${user.id}`, {
                    method: "DELETE"
                });

                if (resposta.ok) {
                    localStorage.removeItem("usuarioLogado");
                    alert("Conta deletada com sucesso.");
                    window.location.href = "index.html";
                } else {
                    alert("Erro ao deletar conta.");
                }
            });

            // Inicia o carregamento das resenhas
            carregarMinhasResenhas();
        }

        // --- FUNÇÕES GLOBAIS (FORA DO ELSE) ---

        async function carregarMinhasResenhas() {
            const userAtual = JSON.parse(localStorage.getItem("usuarioLogado"));
            if (!userAtual) return;

            try {
                const resposta = await fetch(`${API_URL}/resenhas`);
                const todasResenhas = await resposta.json();
                
                const filtradas = Number(userAtual.is_admin) === 1 
                    ? todasResenhas 
                    : todasResenhas.filter(r => r.nome_usuario === userAtual.usuario);

                const container = document.getElementById("minhasResenhasLista");
                if (filtradas.length === 0) {
                    container.innerHTML = "<p>Você ainda não publicou nenhuma resenha.</p>";
                    return;
                }

                container.innerHTML = filtradas.map(r => `
                    <div class="resenha-card" style="margin-bottom: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; position: relative;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <h3>${r.livro} (${"★".repeat(r.nota)})</h3>
                                <small>Por: ${r.nome_usuario} • ❤️ ${r.curtidas} curtidas</small>
                            </div>
                            <button type="button" onclick="deletarResenhaPerfil(${r.id})" 
                                    style="background-color: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer;">
                                🗑️ Excluir
                            </button>
                        </div>
                        <p style="margin-top: 10px;">${r.texto}</p>
                    </div>
                `).join("");
            } catch (err) {
                console.error("Erro ao carregar resenhas do perfil:", err);
            }
        }

        async function deletarResenhaPerfil(id) {
            if (!confirm("Tem certeza que deseja excluir esta resenha?")) return;

            const userAtual = JSON.parse(localStorage.getItem("usuarioLogado"));

            try {
                const resposta = await fetch(`${API_URL}/resenhas/${id}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuarioLogado: userAtual.usuario })
                });

                if (resposta.ok) {
                    carregarMinhasResenhas(); // Agora funciona perfeitamente!
                } else {
                    const erro = await resposta.json();
                    alert(erro.erro || "Erro ao excluir resenha.");
                }
            } catch (err) {
                console.error("Erro ao conectar com o servidor:", err);
                alert("Erro de conexão ao tentar excluir.");
            }
        }
    </script>
</body>
    <script src="../js/auth.js"></script>
</body>

</html>
